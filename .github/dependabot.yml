version: 2
updates:
  # Go modules at the repo root (CLI + Lambdas + shared core).
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      go-dependencies:
        patterns:
          - "*"

  # CDK infra module (separate go.mod under infra/).
  - package-ecosystem: "gomod"
    directory: "/infra"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      infra-dependencies:
        patterns:
          - "*"

  # React/Vite SPA.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      web-dependencies:
        patterns:
          - "*"

  # GitHub Actions used by the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
