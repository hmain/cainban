name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Build binaries
      run: |
        # Linux
        GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o cainban-linux-amd64 cmd/cainban/main.go
        GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o cainban-linux-arm64 cmd/cainban/main.go
        
        # macOS
        GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o cainban-darwin-amd64 cmd/cainban/main.go
        GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o cainban-darwin-arm64 cmd/cainban/main.go
        
        # Windows
        GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o cainban-windows-amd64.exe cmd/cainban/main.go
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          cainban-linux-amd64
          cainban-linux-arm64
          cainban-darwin-amd64
          cainban-darwin-arm64
          cainban-windows-amd64.exe
        generate_release_notes: true
