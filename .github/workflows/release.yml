name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.3'
    
    - name: Build binaries
      run: |
        # Stamp the real version/commit/date into the binary via -ldflags.
        # VERSION is the pushed tag (e.g. v0.4.0); these -X flags override the
        # package-level vars in cmd/cainban/main.go.
        VERSION="${GITHUB_REF_NAME}"
        COMMIT="$(git rev-parse --short HEAD)"
        DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"

        # Linux
        GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o cainban-linux-amd64 cmd/cainban/main.go
        GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o cainban-linux-arm64 cmd/cainban/main.go

        # macOS
        GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o cainban-darwin-amd64 cmd/cainban/main.go
        GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o cainban-darwin-arm64 cmd/cainban/main.go

        # Windows
        GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o cainban-windows-amd64.exe cmd/cainban/main.go
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          cainban-linux-amd64
          cainban-linux-arm64
          cainban-darwin-amd64
          cainban-darwin-arm64
          cainban-windows-amd64.exe
        generate_release_notes: true
