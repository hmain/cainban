name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        go-version: ['1.27.3']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Check go.mod/go.sum are tidy
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum

    - name: Run go vet
      run: go vet ./...

    - name: Run tests
      run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.3'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.14.0
        args: --timeout=10m

  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.3'

    # Scans the module (and its dependency graph) against the Go vulnerability
    # database and fails the build on any vuln reachable from this code.
    - name: govulncheck
      uses: golang/govulncheck-action@v1
      with:
        go-version-input: '1.27.3'
        repo-checkout: false

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        # Full history so gitleaks can scan every commit, not just the tip.
        fetch-depth: 0

    - name: gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.3'

    - name: Build
      run: go build -v ./cmd/cainban

    - name: Test build artifacts
      run: |
        go build -o cainban ./cmd/cainban
        ./cainban version