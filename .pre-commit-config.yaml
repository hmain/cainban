repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: gofmt
        language: system
        types: [go]
        args: [-w]
      
      - id: go-vet
        name: go vet
        entry: go
        language: system
        types: [go]
        args: [vet, ./...]
        pass_filenames: false
      
      - id: go-mod-tidy
        name: go mod tidy
        entry: go
        language: system
        args: [mod, tidy]
        pass_filenames: false
      
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint
        language: system
        types: [go]
        args: [run, --fix]
        pass_filenames: false
      
      - id: go-test
        name: go test
        entry: go
        language: system
        types: [go]  
        args: [test, -race, ./...]
        pass_filenames: false

      # Shift-left security gate: the GitHub device-flow default scope must never
      # re-acquire the broad classic `repo` scope (full read/write to every
      # repo). cainban only does a read-only permission check. The default lives
      # in github_auth.go as defaultDeviceScope; this hook fails the commit if a
      # bare `repo` scope token reappears there. See
      # docs/rfc-github-scope-narrowing.md. (TestDefaultDeviceScopeNeverHasRepo
      # is the test-side counterpart.)
      - id: no-broad-repo-scope
        name: no broad github repo scope in device default
        entry: bash -c 'if grep -nE "(\"repo\"|\"repo | repo\"| repo )" src/systems/mcp/github_auth.go; then echo "ERROR: broad github repo scope found in github_auth.go - cainban must stay read-only. See docs/rfc-github-scope-narrowing.md"; exit 1; fi'
        language: system
        files: ^src/systems/mcp/github_auth\.go$
        pass_filenames: false